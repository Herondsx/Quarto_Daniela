<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quarto da Daniela</title>
  <meta name="description" content="Modelo 3D do quarto da Daniela para testar e comparar posições dos móveis, no celular ou no computador.">
  <meta name="theme-color" content="#F7F1EE">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23C8487A'/%3E%3Cpath d='M14 40V24m0 10h36v6M14 34v-4a4 4 0 0 1 4-4h10v8M50 40v-6' stroke='white' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64"><path d="M14 40V24m0 10h36v6M14 34v-4a4 4 0 0 1 4-4h10v8M50 40v-6" stroke="currentColor" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <div class="brand-txt">
        <h1>Quarto da Daniela</h1>
        <p id="layoutName" class="sub">Como está hoje</p>
      </div>
    </div>
    <div class="actions">
      <button id="btnUndo" class="icon" title="Desfazer (Ctrl+Z)" aria-label="Desfazer" disabled>
        <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      </button>
      <button id="btnPhoto" class="icon" title="Salvar imagem" aria-label="Salvar imagem">
        <svg viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
      <button id="btnShare" class="icon accent" title="Compartilhar este layout" aria-label="Compartilhar este layout">
        <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
      </button>
    </div>
  </header>

  <main class="app">
    <section class="stage" id="stage" aria-label="Visualização 3D do quarto">
      <canvas id="c"></canvas>
      <div id="labels" class="labels" aria-hidden="true"></div>

      <div class="views" role="tablist" aria-label="Tipo de visualização">
        <button role="tab" data-view="3d" class="on" aria-selected="true">3D</button>
        <button role="tab" data-view="plan" aria-selected="false">Planta</button>
        <button role="tab" data-view="door" aria-selected="false">Da porta</button>
      </div>

      <button id="status" class="status ok" aria-haspopup="true" aria-expanded="false">…</button>
      <div id="statusPop" class="pop" hidden></div>

      <div class="toggles" id="toggles">
        <button id="tglClear" class="chip on" aria-pressed="true" title="Mostrar o espaço que cada móvel precisa na frente">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" stroke-dasharray="3 3"/></svg>Áreas de uso
        </button>
        <button id="tglLabels" class="chip on" aria-pressed="true" title="Mostrar nomes dos móveis">
          <svg viewBox="0 0 24 24"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="8" cy="8" r="1.5"/></svg>Nomes
        </button>
      </div>

      <div id="selbar" class="selbar" hidden></div>
      <div id="hint" class="hint" hidden></div>
      <div id="loading" class="loading"><span class="spin"></span>Montando o quarto…</div>
    </section>

    <aside class="panel" id="panel">
      <button class="grab" id="grab" aria-label="Abrir ou fechar o painel"><span></span></button>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="layouts" class="on" aria-selected="true">Sugestões</button>
        <button role="tab" data-tab="items" aria-selected="false">Móveis</button>
        <button role="tab" data-tab="dims" aria-selected="false">Medidas</button>
      </div>
      <div class="tabbody" id="tab-layouts" role="tabpanel"></div>
      <div class="tabbody" id="tab-items" role="tabpanel" hidden></div>
      <div class="tabbody" id="tab-dims" role="tabpanel" hidden></div>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>
  <noscript><p class="nojs">Este site precisa de JavaScript para mostrar o quarto em 3D.</p></noscript>
  <script>
    // Aviso amigável se o navegador for antigo demais ou se algo falhar ao carregar.
    (function () {
      function fail(msg) {
        var l = document.getElementById('loading');
        if (l && !l.classList.contains('done')) l.textContent = msg;
      }
      if (!(window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'))) {
        fail('Este navegador é antigo demais para o 3D. Atualize o navegador (ou o iOS) e tente de novo.');
      }
      window.addEventListener('error', function () { fail('Não foi possível carregar o 3D. Recarregue a página.'); });
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
